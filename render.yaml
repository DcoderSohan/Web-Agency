services:
  # 1. Express Backend Web Service
  - type: web
    name: web-agency-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
        placeholder: "Your MongoDB URI"
      - key: JWT_SECRET
        sync: false
        placeholder: "Your JWT secret key"
      - key: BREVO_API_KEY
        sync: false
        placeholder: "Your Brevo API Key"
      - key: SENDER_EMAIL
        sync: false
        placeholder: "Your Verified Sender Email"
      - key: SENDER_NAME
        value: "VTRC Technologies"
        placeholder: "Sender Name"
      - key: FRONTEND_URL
        sync: false
        placeholder: "Your frontend URL"
      - key: ADMIN_URL
        sync: false
        placeholder: "Your admin dashboard URL"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  # 2. Main React Frontend Static Site
  - type: web
    name: web-agency-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishDir: dist
    routes:
      # Required rewrite for Single Page App (SPA) client-side routing (React Router)
      - src: /*
        dest: /index.html

  # 3. Admin Dashboard Frontend Static Site
  - type: web
    name: web-agency-admin
    env: static
    plan: free
    rootDir: admin
    buildCommand: npm install && npm run build
    publishDir: dist
    routes:
      # Required rewrite for Single Page App (SPA) client-side routing (React Router)
      - src: /*
        dest: /index.html
